<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Game Banner</title>
    <style>
        /* ล้างค่าขอบและตั้งค่าหน้าจอเกมให้เต็มพื้นที่ 100% */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        /* ขยายรูปให้พอดีและเต็มจอเกม */
        .game-banner {
            width: 100%;
            height: 100%;
            object-fit: fill; /* ปรับให้รูปยืดเต็มพื้นที่จอพอดี ไม่เหลือขอบดำ */
        }
    </style>
</head>
<body>
    <!-- ดึงรูปภาพแบนเนอร์จาก GitHub -->
    <img src="https://raw.githubusercontent.com/poopatheerathap123456789-lab/Phupha.github.io/main/mainmenu_banner.png" alt="Game Banner" class="game-banner">
</body>
</html>
