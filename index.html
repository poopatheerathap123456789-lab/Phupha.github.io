<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เว็บของฉัน</title>
    <style>
        /* ล้างค่าขอบและตั้งค่าหน้าจอให้เต็มพื้นที่ */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        /* ปรับรูปให้แสดงผลเต็มจอพอดี */
        .fullscreen-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- แสดงรูปภาพจาก GitHub แบบเต็มจอโดยไม่มีข้อความ -->
    <img src="https://raw.githubusercontent.com/poopatheerathap123456789-lab/Phupha.github.io/main/mainmenu_banner.png" alt="MainMenu Banner" class="fullscreen-img">
</body>
</html>
